name: Claude Code Review

# Manual mode (decision record 0001): the review runs only when a person adds
# the `review` label to a pull request. A session asks for it in the pull
# request description when the change touches the physics, the exporters or
# the .fvd format; the owner agrees by adding the label. Remove the label and
# add it again to review a later push. Nothing runs when a pull request is
# opened, pushed to, reopened or marked ready.
on:
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    # Only the `review` label starts a run. Dependabot's pull requests are
    # skipped: the review action refuses runs that a bot started.
    if: github.event.label.name == 'review' && github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        # Keeps the reviewer's helper sub-agents in the foreground so the run
        # does not end before they answer (learned on HSA_Shoebox).
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          show_full_output: true
