name: Claude Code

# Runs when someone writes @claude in an issue, a pull request comment or a
# review, or opens an issue with @claude in it. Sessions on the owner's PC do
# not use this; it is for asking a question or a small change from GitHub.
#
# Credentials (decision record 0002): the first step pays with Claude Console
# API credits (repository secret ANTHROPIC_API_KEY). If that step fails for
# any reason, including the credits running out or the secret not existing,
# the second step runs the same request on the owner's Claude subscription
# (repository secret CLAUDE_CODE_OAUTH_TOKEN). Both steps need the Claude
# GitHub App installed on this repository (https://github.com/apps/claude).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The runner has no Qt or C++ toolchain, so a run here can read,
      # explain and edit, but not build. See docs/building.md.
      - name: Run Claude Code (API credits)
        id: claude-api
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read

      - name: Run Claude Code (subscription fallback)
        id: claude
        if: steps.claude-api.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
